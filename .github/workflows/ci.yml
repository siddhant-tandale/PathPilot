name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check pathpilot tests
      - name: Test
        run: pytest -q
      - name: Smoke test the CLI
        run: |
          python -m pathpilot plan --planner rrt_star --seed 1 --out plan.png
          python -m pathpilot benchmark --maps 2 --out /tmp/results --figures /tmp/figs
