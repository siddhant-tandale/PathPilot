[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathpilot"
version = "0.3.0"
description = "Grid and sampling-based motion planners (A*, Dijkstra, weighted A*, RRT, RRT*, PRM) with a reproducible benchmark"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Siddhant Tandale" }]
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "imageio>=2.30"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
pathpilot = "pathpilot.cli:main"

[tool.setuptools.packages.find]
include = ["pathpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# zip(a, a[1:]) for consecutive pairs is intentional and unequal by one.
ignore = ["B905"]
